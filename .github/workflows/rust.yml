name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl # 👈 增加 musl 目标

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 👈 安装 musl 编译工具链
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 👈 编译时指定 target
      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-musl --verbose

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: webhook-to-ws-linux-musl
          # 👈 路径里多了 target/x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/webhook-to-ws
